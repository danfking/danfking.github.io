<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  {% seo %}
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}" class="title"><h1>{{ site.title }}</h1></a>
    {% for p in site.header_pages %}
      {% assign page_obj = site.pages | where: 'path', p | first %}
      {% if page_obj %}<a href="{{ page_obj.url | relative_url }}">{{ page_obj.title }}</a>{% endif %}
    {% endfor %}
  </nav>

  <main>
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
