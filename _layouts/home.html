---
layout: default
---

<p>{{ site.description }}</p>

{{ content }}

<ul class="blog-posts">
  {% for post in site.posts %}
    <li>
      <span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time></span>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
